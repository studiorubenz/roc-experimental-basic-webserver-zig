<!-- Ingested into main.roc at build time (import "chat.html" as chat_page),
     so editing this file requires a server rebuild. Server output is
     HTML-escaped in Roc and rendered via innerHTML so <b>name:</b>
     formatting works. -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Roc chat</title>
</head>
<body>
    <h1>Roc chat</h1>
    <p>Open this page in several tabs and chat between them. <code>/help</code> for commands.</p>
    <ul id="log"></ul>
    <form onsubmit="send(); return false;">
        <input id="msg" autocomplete="off" placeholder="Say something...">
        <button>Send</button>
    </form>
    <script>
    var name = "";
    while (name === "") { name = (prompt("Your name?") || "").trim(); }
    var ws = new WebSocket("ws://" + location.host + "/ws");
    ws.onopen = function () { ws.send(name + "\t/joined"); };
    ws.onclose = function () { add("[disconnected]"); };
    ws.onmessage = function (event) { add(event.data); };
    function add(html) {
        var item = document.createElement("li");
        item.innerHTML = html;
        document.getElementById("log").appendChild(item);
    }
    function send() {
        var input = document.getElementById("msg");
        if (input.value === "") { return; }
        ws.send(name + "\t" + input.value);
        input.value = "";
    }
    </script>
</body>
</html>
